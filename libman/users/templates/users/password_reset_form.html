{% extends "library/base.html" %}

{% block title %} Change Password {% endblock %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Forgotten your password?</h1>
<p>Enter your e-mail addresss to create a new password.</p>
<form action="." method="post">
    {{ form.as_p }}
<p><input class="btn btn-primary" type="submit" value="Send e-mail"></p>
{% csrf_token %}
</form>
{% endblock content %}
