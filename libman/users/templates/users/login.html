{% load static %}
{% load crispy_forms_tags %}
{% block content %}
<br/>
<br/>
<br/>

<link rel="stylesheet" href="{% static '/library/css/style.css' %}">
<div style="text-align: center;background-color: var(--background-color);width: 100%;">
    <form method="POST">
        {% csrf_token %}
            <h1>BOOKIPIDIA LOGIN</h1>
            <br/>
            {{ form|crispy }}
        <br/>
        <div>
            <button id="viewBtn" type="submit">Login</button>
        </div>
    </form>
    <div class="border-top pt-3">
     <p>
    Need An Account? <a href="{% url 'register' %}">Sign Up Now</a>
     </p>
    </div>
</div>
{% endblock content %}
