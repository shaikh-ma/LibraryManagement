{% extends "library/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
      <div class="media">
        <img style="width: 150px" class="rounded-circle account-img" src="{{ user.profile.image.url }}">
        <div class="media-body">
          <h2 class="account-heading">{{ user.username }}</h2>
          <p class="text-secondary">{{ user.email }}</p>
          <p class="text-secondary">{{ user.roll_no }}</p>
          <p class="text-secondary">{{ user.icard_no }}</p>
          <p class="text-secondary">{{ user.class_div }}</p>
        </div>
      </div>
      <!-- FORM HERE -->
    </div>
{% endblock content %}
