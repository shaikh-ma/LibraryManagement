/{% load crispy_forms_tags %}
{% extends "library/base.html" %}

{% block title %} RETURN REQUEST {% endblock %}
{% block heading %} RETURN REQUEST {% endblock %}
{% load crispy_forms_tags %}
{% block content %}
<form class="form-control" method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
        <legend class="border-bottom mb-4">Confirm Return Request</legend>
        {{ form|crispy }}
        <br />
        <button type="submit" class="btn-primary btn">Submit</button>
        <a href="{% url 'home' %}" class="btn-primary btn">Cancel</a>
    </fieldset>
</form>
{% endblock content %}
