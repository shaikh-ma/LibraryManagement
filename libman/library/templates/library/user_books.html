{% extends "library/base.html" %}
{% block content %}
  <br/>
  <br/>
  <br/>
  {% for book in books %}
  <div class="card">
  <div class="card-body">
    <h2 class="card-title">{{ book.title }}</h2>
    <p class="card-text">Author: {{ book.author }}</p> 
    <p class="card-text">Book Code: {{ book.book_code }}</p> 
    <a class="btn-primary btn" href="{% url 'book_detail' book.pk %}">View Book</a>
    <a class="btn-primary btn" href="{% url 'request-return' book.pk %}">Return Book</a>
  </div>
  </div>
  {% endfor %}
{% endblock content %}
