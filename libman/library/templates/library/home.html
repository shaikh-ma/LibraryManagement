{% extends 'library/base.html' %}
{% load static %}
{% block content %}
<!-- <input type="text" id="searchbook" onkeyup="findBook()" placeholder="Search for book.." title="Type in book name"> -->
<style>
.card {
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  display: inline-table;
  margin: 15px;
  /* border: 1px solid; */
  margin-bottom: 35px;
  text-align: center;
  font-family: arial;
  }
</style>

{% for book in books %}
  <div class="card">
      <h2 class="title">{{ book.title }}</h2>
      <h4>{{ book.author }}</h4>
      <img src="{% static 'library/book.png' %}" alt="{{ book.title }}" style="width:100px">
      <p>Book Code: {{ book.book_code }}</p>
      {% if book.is_available %}
        <a style="background-color: green;color:white; padding:5px" href="{% url 'new-user-requests' %}">Request Book</a>
      {% else %}
        <p style="background-color: red;color:white; padding:5px">Not available</p>
      {% endif %}
  </div>
  &nbsp;
  &nbsp;
  &nbsp;
{% endfor %}
</div>
</body>

{% endblock %}
