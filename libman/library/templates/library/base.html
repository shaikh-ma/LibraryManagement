{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookipedia - Library</title>
    <style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}

li {
  float: left;
}

li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

li a:hover {
  background-color: #111;
}
</style>
</head>
<body>
  <div>
    <img style="width: 120px;" src="{% static 'library/logo.png' %}"/>
    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'profile' %}">My Profile</a></li>
        <li><a href="#">My Books</a></li>
        {% if user.is_authenticate %}
        <li><a href="{% url 'logout' %}">Logout</a></li>
        {% endif %}
    </ul>
    </div>
    {% block content %}
    {% endblock %}
</body>
</html>
