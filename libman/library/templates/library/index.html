{% extends 'library/base.html' %}
{% load static %}
{% block content %}
 <style>
.card {
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  max-width: 80%;
  margin: auto;
  text-align: center;
  font-family: arial;
}

.title {
  color: grey;
  font-size: 18px;
}

button {
  border: none;
  outline: 0;
  display: inline-block;
  padding: 8px;
  color: white;
  background-color: #000;
  text-align: center;
  cursor: pointer;
  width: 100%;
  font-size: 18px;
}

a {
  text-decoration: none;
  font-size: 22px;
  color: black;
}

button:hover, a:hover {
  opacity: 0.7;
}

        table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        }
        th{
            background-color: cornflowerblue;
            color: white;
            padding: 10px;
        }
        input[type=button], input[type=submit]{
            padding : 10px;
            border-radius: 15px;
            background-color: cornflowerblue;
            color: white;
        }
    </style>
    <input type="text" id="searchbook" onkeyup="findBook()" placeholder="Search for book.." title="Type in book name">
    <br/>
    <br/>
    {% for book in books %}
    <div class="card">
        <img src="{% static 'library/book.png' %}" alt="{{ book.title }}" style="width:100px">
        <h2 class="title">{{ book.title }}</h2>
        <p>{{ book.author }}</p>
        <p>{{ book.book_id }}</p>
        {% if book.is_available %}
           <button style="background-color: green;color:white; padding:5px">Request Book</button>
        {% else %}
           <p style="background-color: red;color:white; padding:5px">Not available</p>
        {% endif %}
        {% if user.is_admin %}
           <p style="background-color: green;color:white; padding:5px">Edit Book</p>
        {% endif %}
    </div>
    <br/>
    {% endfor %}
</div>
</body>
