<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
    <style>
        table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
        }
        th{
            background-color: cornflowerblue;
            color: white;
            padding: 10px;
        }
        input[type=button], input[type=submit]{
            padding : 10px;
            border-radius: 15px;
            background-color: cornflowerblue;
            color: white;
        }
    </style>
    <input type="text" id="searchbook" onkeyup="findBook()" placeholder="Search for book.." title="Type in book name">
    <br/>
    <br/>
    <table id="BooksTable" style="width:100%; text-align:center">
      <tr>
        <th>Book Title</th>
        <th>Book Author</th>
        <th>No. of copies</th>
        <th>Available copies</th>
        <th>Action</th>
      </tr>
      {% for book in books %}
      <tr id="booktitle">
          <td>{{book.title}}</td>
          <td>{{book.author}}</td>
          <td>{{book.number_of_copies}}</td>
          <td>{{book.available_copies}}</td>
          {% if book.available_copies > 0 %}
              <td><input type="button" value="Borrow it"/></td>
          {% else %}
          <td><p>Not available.</p></td>
          {% endif %}
      </tr>
      {% endfor %}
    </table>
    <br/>
</body>

<script>
function findBook() {
    var input, filter, table, tr, td, i, txtValue;
    input = document.getElementById("searchbook");
    filter = input.value.toUpperCase();
    table = document.getElementById("BooksTable");
    tr = table.getElementsByTagName("tr");
    for (i = 0; i < tr.length; i++) {
    td = tr[i].getElementsByTagName("td")[0];
    if (td) {
        txtValue = td.textContent || td.innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
        tr[i].style.display = "";
        } else {
        tr[i].style.display = "none";
        }
    }
    }
}
    </script>
</html>
