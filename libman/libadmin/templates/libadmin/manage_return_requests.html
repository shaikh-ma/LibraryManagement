
{% extends "library/base.html" %}

{% block content %}
{% if not requests %}
No new request!
{% else %}
{% for request in requests %}
<div class="card">
    <div>
        <h2>{{ request.request_user}}</h2>
        <h2>{{ request.request_book }}</h2>
        <p><a href="{% url 'approve_request' request.pk %}">Approve</a></p>
        <p><a href="{% url 'delete_request' request.pk %}">Delete</a></p>
    </div>
</div>
{% endfor %}
{% endif %}
{% endblock %}
