{% extends "library/base.html" %}

{% block content %}

{% for user in users %}
<div class="card">
    <div>
        <p>{{ user }}</p>
        {% if not user.is_superuser %}
        <p><a href="{% url 'delete_user' user.pk %}">Delete</a></p>
        {% endif %}
    </div>
</div>
{% endfor %}

{% endblock %}
